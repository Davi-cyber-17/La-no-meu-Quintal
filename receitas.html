<body>

<a href="#receitas" class="pular-conteudo">Pular para as receitas</a>

<header class="cabecalho">
  <div class="container">
    <a href="index.html" class="marca">
      <img src="assets/logo.jpeg" alt="Logo Lá no meu Quintal" width="52" height="52" />
      <span class="marca-nome">Lá no meu Quintal<span>BLOG DE RECEITAS</span></span>
    </a>
    <button class="menu-botao" id="botaoMenu" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="navegacao">☰</button>
    <nav class="navegacao" id="navegacao" aria-label="Navegação principal">
      <a href="index.html">Início</a>
      <a href="receitas.html" class="ativo" aria-current="page">Receitas</a>
      <a href="dicas.html">Contos</a>

<main>
  <section class="hero hero-compacto">
    <div class="container">
      <h1>Receitas</h1>
      <p>Busque pelo nome ou por um ingrediente que você tem em casa.</p>
    </div>
  </section>

  <section class="secao-receitas" id="receitas">
    <div class="container">
      <div class="busca" role="search">
        <label for="campoBusca" class="so-leitor">Buscar receitas</label>
        <input type="search" id="campoBusca" placeholder="Buscar por nome ou ingrediente..." autocomplete="off" />
        <button type="button" class="busca-limpar" id="limparBusca" aria-label="Limpar busca" hidden>×</button>
      </div>
      <div class="filtros" id="filtros" role="group" aria-label="Filtrar por categoria"></div>
      <p class="contagem" id="contagem" role="status" aria-live="polite"></p>
      <div class="grade-receitas" id="grade"></div>
      <noscript><p class="sem-resultados">Ative o JavaScript no navegador para ver as receitas.</p></noscript>
    </div>
  </section>
</main>

<footer class="rodape">
  <div class="container">
    <div>
      <div class="rodape-marca">Lá no meu Quintal</div>
      <p>Receitas de família, um prato de cada vez.</p>
    </div>
    <div class="rodape-links">
